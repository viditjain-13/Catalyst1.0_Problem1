name: Vulnerability Reachability PR Bot

on:
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  reachability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Run reachability scanner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Change benchmarks/cve-pyyaml to "." when running on a target app repo
          python scan.py .

      - name: Format PR comment
        run: |
          python - << 'EOF'
          import json
          data = json.load(open("verdicts.json", encoding="utf-8"))
          findings = data if isinstance(data, list) else data.get("verdicts") or data.get("findings") or []
          counts = {"reachable": 0, "not_reachable": 0, "uncertain": 0}
          rows = []
          for f in findings:
              v = str(f.get("verdict", "uncertain")).lower()
              counts[v] = counts.get(v, 0) + 1
              cve = f.get("id") or f.get("advisory_id") or "N/A"
              pkg = f.get("package", "unknown")
              conf = f.get("confidence", "")
              rows.append(f"| `{cve}` | `{pkg}` | **{v}** | {conf} |")
          md = [
              "## Vulnerability Reachability Report",
              f"- **Reachable:** {counts['reachable']}  |  **Not Reachable (OpenVEX):** {counts['not_reachable']}  |  **Uncertain:** {counts['uncertain']}",
              "",
              "| Advisory | Package | Verdict | Confidence |",
              "| :--- | :--- | :--- | :--- |",
              *rows,
              "",
              "_Generated via static AST analysis (no target code executed). OpenVEX report attached as workflow artifact._"
          ]
          open("pr_comment.md", "w", encoding="utf-8").write("\n".join(md))
          EOF

      - name: Post comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Upload OpenVEX report
        uses: actions/upload-artifact@v4
        with:
          name: openvex-report
          path: |
            verdicts.json
            report.openvex.json